<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonsterDex Hacker Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Boogaloo&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background:
    radial-gradient(circle at 12% 12%, rgba(88, 216, 255, 0.24), transparent 30%),
    radial-gradient(circle at 84% 20%, rgba(255, 201, 87, 0.22), transparent 34%),
    linear-gradient(150deg, #07213a 0%, #0d1f29 50%, #111c2a 100%);
  color: #dbf7ff;
  font-family: 'Rubik', sans-serif;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.panel {
  width: min(880px, 100%);
  border: 2px solid #66dcff;
  background: rgba(8, 28, 44, 0.9);
  box-shadow: 0 0 24px rgba(102, 220, 255, 0.2), inset 0 0 30px rgba(102, 220, 255, 0.06);
  border-radius: 12px;
  padding: 22px;
  position: relative;
  overflow: hidden;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(188, 240, 255, 0.03) 0,
    rgba(188, 240, 255, 0.03) 1px,
    transparent 1px,
    transparent 4px
  );
}

.kicker {
  font-family: 'Boogaloo', cursive;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #88e4ff;
  margin-bottom: 8px;
}

h1 {
  font-family: 'Bangers', cursive;
  font-size: clamp(36px, 7vw, 56px);
  letter-spacing: 3px;
  color: #f0fbff;
  margin-bottom: 8px;
  text-shadow: 0 0 12px rgba(102, 220, 255, 0.25);
}

.lead {
  color: #c8efff;
  line-height: 1.5;
  margin-bottom: 14px;
}

.hud {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.hud-card {
  border: 1px solid #66dcff;
  border-radius: 8px;
  padding: 10px;
  background: rgba(8, 42, 65, 0.58);
}

.hud-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9edfff;
  margin-bottom: 4px;
}

.hud-value {
  font-family: 'Boogaloo', cursive;
  font-size: 22px;
  line-height: 1;
  color: #f0fbff;
}

.terminal {
  border: 1px solid #66dcff;
  background: #061826;
  border-radius: 8px;
  padding: 14px 14px 10px;
  font-family: 'Consolas', 'Courier New', monospace;
  color: #c9f2ff;
  line-height: 1.6;
  min-height: 250px;
  max-height: 320px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.terminal-line {
  margin-bottom: 6px;
  white-space: pre-wrap;
  word-break: break-word;
}

.input-row {
  display: flex;
  gap: 8px;
}

.command-input {
  flex: 1;
  background: #081b2b;
  color: #f0fbff;
  border: 1px solid #66dcff;
  border-radius: 6px;
  padding: 11px 12px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  outline: none;
}

.command-input:focus {
  box-shadow: 0 0 0 2px rgba(102, 220, 255, 0.25);
}

.run-btn,
.aux-btn {
  border: 1px solid #66dcff;
  background: #114062;
  color: #f0fbff;
  border-radius: 6px;
  padding: 10px 12px;
  font-family: 'Rubik', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
}

.run-btn:hover,
.aux-btn:hover {
  background: #17608f;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 9px;
}

.prompt { color: #e9f8ff; }
.muted { color: #a8ddf4; }
.warn { color: #ffe08a; }
.danger { color: #ffb6b6; }
.success { color: #9cffcf; }

.status {
  margin-top: 14px;
  border: 1px dashed #66dcff;
  border-radius: 8px;
  padding: 10px;
  color: #def4ff;
  background: rgba(8, 42, 65, 0.42);
  font-size: 14px;
}

.glitch {
  animation: flicker 1.7s infinite alternate;
}

@keyframes flicker {
  0% { opacity: 1; }
  25% { opacity: 0.9; }
  50% { opacity: 1; }
  100% { opacity: 0.94; }
}

.back-link {
  display: inline-block;
  margin-top: 14px;
  color: #e9f8ff;
  text-decoration: none;
  border-bottom: 1px dashed #88e4ff;
}

.back-link:hover {
  color: #fff;
  border-bottom-color: #fff;
}

@media (max-width: 760px) {
  .panel { padding: 16px; }
  .hud { grid-template-columns: 1fr; }
  .terminal { min-height: 220px; max-height: 300px; }
  .input-row { flex-direction: column; }
  .run-btn { width: 100%; }
}
</style>
</head>
<body>
  <main class="panel">
    <div class="scanlines"></div>
    <div class="kicker">MonsterDex Kids Quest</div>
    <h1 class="glitch">Hacker Mode Junior</h1>
    <p class="lead">Welcome, Code Ranger. Solve three fun puzzles to help the baby dragon open the treasure gate. Type your answer with <strong>code</strong> or just type the answer word/number.</p>

    <section class="hud" aria-label="Game status">
      <div class="hud-card">
        <div class="hud-label">Level</div>
        <div class="hud-value" id="stage">1 / 3</div>
      </div>
      <div class="hud-card">
        <div class="hud-label">Stars</div>
        <div class="hud-value" id="stars">5</div>
      </div>
      <div class="hud-card">
        <div class="hud-label">Time</div>
        <div class="hud-value" id="time">240s</div>
      </div>
    </section>

    <div class="terminal" id="terminal" aria-live="polite"></div>

    <form class="input-row" id="command-form">
      <input
        class="command-input"
        id="command-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Type answer... try help"
      >
      <button class="run-btn" type="submit">Run</button>
    </form>

    <div class="actions">
      <button class="aux-btn" id="hint-btn" type="button">Hint</button>
      <button class="aux-btn" id="restart-btn" type="button">Restart</button>
      <button class="aux-btn" id="clear-btn" type="button">Clear Log</button>
    </div>

    <div class="status" id="status-box">
      Get ready for Level 1.
    </div>

    <a class="back-link" href="index.html">← Back to Home</a>
  </main>

<script>
const terminalEl = document.getElementById('terminal');
const formEl = document.getElementById('command-form');
const inputEl = document.getElementById('command-input');
const stageEl = document.getElementById('stage');
const starsEl = document.getElementById('stars');
const timeEl = document.getElementById('time');
const statusBoxEl = document.getElementById('status-box');
const hintBtn = document.getElementById('hint-btn');
const restartBtn = document.getElementById('restart-btn');
const clearBtn = document.getElementById('clear-btn');

const MAX_TIME = 240;
let timerId = null;
let timeLeft = MAX_TIME;
let stars = 5;
let stage = 1;
let solved = false;

const stages = [
  {
    title: 'Level 1',
    question: 'I am a monster that flies and breathes fire. What am I?',
    answers: ['DRAGON'],
    hint: 'It has wings and appears in many fairy tales.'
  },
  {
    title: 'Level 2',
    question: 'Math code: 6 + 7 = ?',
    answers: ['13', 'THIRTEEN'],
    hint: 'Count up from 6 by 7 more steps.'
  },
  {
    title: 'Level 3',
    question: 'Pattern code: 2, 4, 6, ? ',
    answers: ['8', 'EIGHT'],
    hint: 'The numbers go up by 2 each time.'
  }
];

function addLine(text, cls = '') {
  const line = document.createElement('div');
  line.className = `terminal-line ${cls}`.trim();
  line.textContent = text;
  terminalEl.appendChild(line);
  terminalEl.scrollTop = terminalEl.scrollHeight;
}

function updateHud() {
  stageEl.textContent = `${stage} / 3`;
  starsEl.textContent = `${Math.max(0, stars)}`;
  timeEl.textContent = `${Math.max(0, timeLeft)}s`;
}

function updateStatus() {
  if (solved) {
    statusBoxEl.textContent = 'You did it. The treasure gate is open and the baby dragon is safe.';
    return;
  }

  if (stars <= 0 || timeLeft <= 0) {
    statusBoxEl.textContent = 'Game over for now. Press Restart and try again.';
    return;
  }

  statusBoxEl.textContent = `${stages[stage - 1].title}: ${stages[stage - 1].question}`;
}

function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    if (solved) {
      clearInterval(timerId);
      return;
    }
    timeLeft -= 1;
    if (timeLeft <= 0 || stars <= 0) {
      timeLeft = Math.max(0, timeLeft);
      stars = Math.max(0, stars);
      updateHud();
      updateStatus();
      addLine('[TIME] Time is up. Type restart to play again.', 'danger');
      clearInterval(timerId);
      return;
    }
    updateHud();
  }, 1000);
}

function normalizeAnswer(text) {
  return text.trim().toUpperCase();
}

function extractAnswer(trimmedInput) {
  const text = normalizeAnswer(trimmedInput);
  if (text.startsWith('CODE ')) {
    return text.slice(5).trim();
  }
  if (text.startsWith('ANSWER ')) {
    return text.slice(7).trim();
  }
  return text;
}

function penalize() {
  stars -= 1;
  if (stars < 0) stars = 0;
  addLine('[TRY AGAIN] Not quite. You lose 1 star.', 'warn');
  if (stars <= 0) {
    addLine('[GAME] No stars left. Type restart.', 'danger');
    clearInterval(timerId);
  }
}

function completeStage() {
  if (stage < 3) {
    stage += 1;
    addLine(`[SUCCESS] Great job! Level ${stage - 1} complete.`, 'success');
    addLine(`${stages[stage - 1].title}: ${stages[stage - 1].question}`, 'muted');
  } else {
    solved = true;
    addLine('[WINNER] You solved all levels and unlocked the gate.', 'success');
    clearInterval(timerId);
  }
  updateHud();
  updateStatus();
}

function showHelp() {
  addLine('Commands you can use:', 'muted');
  addLine('  help', 'muted');
  addLine('  hint', 'muted');
  addLine('  restart', 'muted');
  addLine('  clear', 'muted');
  addLine('Answer format:', 'muted');
  addLine('  code dragon', 'muted');
  addLine('or just type:', 'muted');
  addLine('  dragon', 'muted');
}

function showHint() {
  addLine(`[HINT] ${stages[stage - 1].hint}`, 'warn');
}

function resetGame() {
  clearInterval(timerId);
  timeLeft = MAX_TIME;
  stars = 5;
  stage = 1;
  solved = false;

  terminalEl.innerHTML = '';
  addLine('kidcoder@monsterdex:~$ start_quest', 'prompt');
  addLine('[OK] Quest loaded. Solve 3 levels to win.', 'muted');
  addLine(`${stages[0].title}: ${stages[0].question}`, 'muted');

  updateHud();
  updateStatus();
  startTimer();
}

function handleCommand(rawInput) {
  const trimmed = rawInput.trim();
  if (!trimmed) return;

  addLine(`kidcoder@monsterdex:~$ ${trimmed}`, 'prompt');

  const parts = trimmed.split(/\s+/);
  const command = parts[0].toLowerCase();

  if (command === 'help') {
    showHelp();
    return;
  }

  if (command === 'clear') {
    terminalEl.innerHTML = '';
    addLine('[LOG] Terminal cleared.', 'muted');
    return;
  }

  if (command === 'restart') {
    addLine('[SYSTEM] Restarting quest...', 'muted');
    resetGame();
    return;
  }

  if (command === 'hint') {
    showHint();
    return;
  }

  if (solved) {
    addLine('[INFO] You already won. Type restart for a new game.', 'muted');
    return;
  }

  if (stars <= 0 || timeLeft <= 0) {
    addLine('[LOCKED] Game ended. Type restart.', 'danger');
    return;
  }

  const answer = extractAnswer(trimmed);
  const currentStage = stages[stage - 1];
  if (currentStage.answers.includes(answer)) {
    completeStage();
    return;
  }

  if (command === 'code' || command === 'answer' || /^[a-z0-9]+$/i.test(answer)) {
    penalize();
    updateHud();
    updateStatus();
    return;
  }

  addLine('[ERROR] Unknown command. Try help.', 'danger');
}

formEl.addEventListener('submit', e => {
  e.preventDefault();
  handleCommand(inputEl.value);
  inputEl.value = '';
  inputEl.focus();
});

hintBtn.addEventListener('click', showHint);
restartBtn.addEventListener('click', () => {
  addLine('kidcoder@monsterdex:~$ restart', 'prompt');
  addLine('[SYSTEM] Restarting quest...', 'muted');
  resetGame();
});
clearBtn.addEventListener('click', () => {
  addLine('kidcoder@monsterdex:~$ clear', 'prompt');
  terminalEl.innerHTML = '';
  addLine('[LOG] Terminal cleared.', 'muted');
});

resetGame();
</script>
</body>
</html>
